[platformio]
default_envs = switch2_w

[env:endpoint]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
build_flags =
    -DAVTOSTAR_TARGET_ESP12F=1

[env:switch2_w]
extends = env:endpoint
build_flags =
    ${env:endpoint.build_flags}
    -DAVTOSTAR_ROLE=1
    -DAVTOSTAR_RS485_ENABLED=0

[env:switch2_wr]
extends = env:endpoint
build_flags =
    ${env:endpoint.build_flags}
    -DAVTOSTAR_ROLE=1
    -DAVTOSTAR_RS485_ENABLED=1

[env:relay2_w]
extends = env:endpoint
build_flags =
    ${env:endpoint.build_flags}
    -DAVTOSTAR_ROLE=2
    -DAVTOSTAR_RS485_ENABLED=0

[env:relay2_wr]
extends = env:endpoint
build_flags =
    ${env:endpoint.build_flags}
    -DAVTOSTAR_ROLE=2
    -DAVTOSTAR_RS485_ENABLED=1

[env:control]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DAVTOSTAR_ROLE=3
    -DAVTOSTAR_RS485_ENABLED=1
