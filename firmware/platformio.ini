[platformio]
default_envs = switch2_w

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:switch2_w]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DAVTOSTAR_ROLE=1
    -DAVTOSTAR_CAN_ENABLED=0

[env:switch2_wc]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DAVTOSTAR_ROLE=1
    -DAVTOSTAR_CAN_ENABLED=1

[env:relay2_w]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DAVTOSTAR_ROLE=2
    -DAVTOSTAR_CAN_ENABLED=0

[env:relay2_wc]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DAVTOSTAR_ROLE=2
    -DAVTOSTAR_CAN_ENABLED=1

[env:control]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DAVTOSTAR_ROLE=3
    -DAVTOSTAR_CAN_ENABLED=1
